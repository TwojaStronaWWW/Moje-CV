name: CI/CD Pipeline & Deployment

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: 1. Quality Gate & Testy Jednostkowe
    runs-on: ubuntu-latest

    steps:
      - name: 1.1 Pobranie kodu repozytorium
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: 1.2 Konfiguracja środowiska Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 1.3 Sprawdzenie poprawności syntaktycznej JavaScript
        run: npm run check:syntax

      - name: 1.4 Uruchomienie testów jednostkowych i raportu pokrycia (Coverage)
        run: npm run test:coverage

  build-and-audit:
    name: 2. Budowa PDF & Audyt Lighthouse CI
    needs: [test]
    runs-on: ubuntu-latest

    steps:
      - name: 2.1 Pobranie kodu repozytorium
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: 2.2 Konfiguracja środowiska Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 2.3 Przygotowanie katalogu dist
        run: |
          mkdir -p dist
          cp index.html robots.txt sitemap.xml site.webmanifest llms.txt dist/
          cp -r .well-known dist/
          cp -r assets dist/

      - name: 2.4 Generowanie oficjalnego pliku PDF
        run: npm run build:pdf

      - name: 2.5 Zapisanie pliku PDF jako artefakt wydania (GitHub Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: Krzysztof_Poczatek_CV-PDF
          path: dist/Krzysztof_Poczatek_CV.pdf
          retention-days: 30

      - name: 2.6 Audyt jakościowy Lighthouse CI (a11y, SEO, Best Practices)
        uses: treosh/lighthouse-ci-action@v12
        with:
          uploadArtifacts: true
          temporaryPublicStorage: true
          configPath: './.lighthouserc.json'

  deploy:
    name: 3. Wdrożenie na serwer produkcyjny (LH)
    needs: [build-and-audit]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest

    steps:
      - name: 3.1 Pobranie kodu repozytorium
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: 3.2 Konfiguracja środowiska Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 3.3 Przygotowanie paczki produkcyjnej (HTML + SEO + PWA + Assets + PDF)
        run: |
          mkdir -p dist
          cp index.html robots.txt sitemap.xml site.webmanifest llms.txt dist/
          cp -r .well-known dist/
          cp -r assets dist/
          npm run build:pdf

      - name: 3.4 Bezpieczny transfer SFTP na serwer hostingowy LH
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server: ${{ secrets.FTP_SERVER }}
          port: ${{ secrets.FTP_PORT }}
          local_path: './dist/*'
          remote_path: '/home/platne/serwer417204/public_html/krzysztofpoczatek.pl'
          sftpArgs: '-o ConnectTimeout=60'

      - name: 3.5 Czyszczenie cache Cloudflare CDN (opcjonalnie)
        if: env.CF_ZONE != '' && env.CF_TOKEN != ''
        env:
          CF_ZONE: ${{ secrets.CLOUDFLARE_ZONE }}
          CF_TOKEN: ${{ secrets.CLOUDFLARE_TOKEN }}
        run: |
          echo "Purging Cloudflare edge cache..."
          curl -s -X POST "https://api.cloudflare.com/client/v4/zones/$CF_ZONE/purge_cache" \
            -H "Authorization: Bearer $CF_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}'