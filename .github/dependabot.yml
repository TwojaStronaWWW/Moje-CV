# Konfiguracja Dependabot dla repozytorium Moje-CV
# Wzorowana na standardach projektu Gal Anonim (zgodność z ISO/IEC 27001)

version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
